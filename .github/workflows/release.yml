name: Release

# Publishes a new version on every push to `main` that changes a package (docs/RELEASING.md, "Publishing on push").
# The version is the patch after the one on npm (0.1.0 -> 0.1.1), unless the repository's version is ahead (a
# deliberate minor or major bump wins). The repository is NOT committed back; a tag vX.Y.Z marks the commit.
#
# Publishing uses npm trusted publishing (OIDC): there is NO npm token anywhere in this repository or its secrets.
#
# Gate: `publish` needs BOTH `ci` and `release-checks`.
#   - `ci` calls ci.yml (a reusable workflow) from this same commit: lint, typecheck, format, unit tests with
#     coverage thresholds, the dependency audit, the integration tests on PostgreSQL and MySQL, and the
#     package-contents check. If any of those fails, is cancelled or is skipped, `publish` does not run.
#   - `release-checks` is the strict package check for the computed version.
# SQL Server: `mssql` calls mssql.yml for the same commit. `publish-mssql` needs it AND `publish`, so
# dynalitics-mssql ships with the same version only when SQL Server is green; otherwise it is skipped and stays "TBD".
on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - '!packages/*/test/**'
      - 'package-lock.json'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run every check and `npm publish --dry-run`, publish nothing'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    # Same commit as this workflow run. The called workflow's permissions cannot exceed ours (contents: read).
    uses: ./.github/workflows/ci.yml

  mssql:
    uses: ./.github/workflows/mssql.yml

  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      next: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - id: next
        name: Next version (npm latest + 1 patch, or the repository's if ahead)
        run: echo "version=$(node scripts/release-version.mjs next)" >> "$GITHUB_OUTPUT"

  release-checks:
    needs: [version]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.version.outputs.next }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/release-version.mjs apply "$VERSION"
      - run: npm run build
      - name: Protocol types in sync
        run: npm run check:protocol -w dynalitics-dashboard
      - name: Published contents, strict (no placeholders, every version equals the release)
        run: node scripts/check-release.mjs --tag "v$VERSION"

  publish:
    # Both must have succeeded. Do not add an `if:` that overrides this (for example `always()`).
    needs: [ci, release-checks, version]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The environment can require a manual approval before anything is published.
    environment: npm-publish
    permissions:
      contents: write # only to create the vX.Y.Z tag through the API after a real publish
      id-token: write # lets npm exchange the GitHub OIDC identity for a short-lived publish credential
    env:
      VERSION: ${{ needs.version.outputs.next }}
      # Real only for a push to main, or a manual run on main with dry_run turned off. Anything else is a dry run.
      REAL_RELEASE: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.dry_run == false) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm >= 11.5.1; the npm bundled with Node 22 is older.
      - run: npm install --global npm@11.10.1 --ignore-scripts
      - run: npm ci
      - run: node scripts/release-version.mjs apply "$VERSION"
      - run: npm run build
      - name: Publish (real only for main; otherwise a dry run)
        run: |
          flag="--dry-run"
          if [ "$REAL_RELEASE" = "true" ]; then flag=""; fi
          # Core first: the adapters declare it as a peer dependency at the same version.
          for w in dynalitics dynalitics-postgres dynalitics-mysql dynalitics-consent dynalitics-dashboard; do
            # Re-running a failed job must not fail on what an earlier attempt (or a maintainer) already published.
            if [ "$(npm view "$w@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
              echo "$w@$VERSION is already on npm, skipping"
              continue
            fi
            npm publish --workspace "packages/$w" --provenance --access public $flag
          done
      - name: Tag the released commit
        if: ${{ env.REAL_RELEASE == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" --jq .object.sha 2>/dev/null || true)"
          if [ "$existing" = "$GITHUB_SHA" ]; then echo "v$VERSION already tags this commit"; exit 0; fi
          if [ -n "$existing" ]; then echo "::error::v$VERSION already tags another commit ($existing)"; exit 1; fi
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/v$VERSION" -f "sha=$GITHUB_SHA"

  publish-mssql:
    # SQL Server ships only when its integration job is green on this commit, and after the core it peers on.
    needs: [publish, mssql, version]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.next }}
      REAL_RELEASE: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.dry_run == false) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install --global npm@11.10.1 --ignore-scripts
      - run: npm ci
      - run: node scripts/release-version.mjs apply "$VERSION"
      - run: npm run build
      - name: Publish dynalitics-mssql (real only for main; otherwise a dry run)
        run: |
          flag="--dry-run"
          if [ "$REAL_RELEASE" = "true" ]; then flag=""; fi
          # Re-running a failed job must not fail on a version that is already published.
          if [ "$(npm view "dynalitics-mssql@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "dynalitics-mssql@$VERSION is already on npm, skipping"
            exit 0
          fi
          npm publish --workspace packages/dynalitics-mssql --provenance --access public $flag
