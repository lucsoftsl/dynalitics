# Test databases for dynalitics integration tests. Local use only.
# Ports are bound to 127.0.0.1 and chosen not to collide with common local databases.
# The credentials below are throw-away, test-only values. Never reuse them anywhere.
name: dynalitics-test
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dyn_admin
      POSTGRES_PASSWORD: dyn_test_pw_1
      POSTGRES_DB: dynalitics_test
    ports: ['127.0.0.1:55432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dyn_admin -d dynalitics_test']
      interval: 3s
      timeout: 3s
      retries: 30
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: dyn_test_pw_1
      MYSQL_DATABASE: dynalitics_test
    ports: ['127.0.0.1:53306:3306']
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -pdyn_test_pw_1 --silent']
      interval: 3s
      timeout: 3s
      retries: 40
  mssql:
    # amd64 only: runs under emulation on Apple silicon; CI on ubuntu-latest is the reliable run.
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: 'Dyn_test_pw_1!'
    ports: ['127.0.0.1:51433:1433']
    profiles: ['mssql']
